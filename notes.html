1kg chicken thighs (bone-in)
1/2 cup soy sauce - Datu Puti only
1/3 cup cane vinegar
6 cloves garlic, crushed not minced
3 bay leaves, 1 tsp peppercorns
1 tbsp brown sugar

Don't stir too early. Let the vinegar cook off first. She always said "Hayaan mo lang" — just let it be.

The secret is patience. Low fire for 45 minutes. The sauce should be almost gone, just coating everything.

Serve with sinangag. Extra rice, always extra rice.

Linked to: [[Habits: Evening Reflection]]`,date:"Sep 19",editedAt:"Edited Sep 19",tags:["Personal"],pinned:!0,wordCount:67},{id:"7",title:"Plant Care - Monstera & Snake Plants",preview:"Monstera: water every 10 days, indirect light only. Snake: ignore it (seriously). Repot monstera in Oct...",content:`Plant Care Schedule

MONSTERA DELICIOSA (Mona)
- Water: every 10 days, check soil 2 inches deep
- Light: indirect, near east window
- Mist leaves 2x week
- Repot in October - she's outgrown current pot
- Fertilize: last week of month

SNAKE PLANT (Sly)
- Water: every 3 weeks
- Light: literally anywhere, even dark corner
- Rule: Ignore it. Seriously. Thrives on neglect.

POTHOS (Bathroom)
- Water weekly
- Trimming needed — getting leggy

Last watered: Sep 22 (all)

Linked to: [[Habits: Plant Check]]`,date:"Sep 17",editedAt:"Edited Sep 22",tags:["Personal"],pinned:!1,wordCount:71},{id:"8",title:"Sari-Sari Store App — Concept",preview:"What if we digitized the sari-sari? Not to replace, but to support. Inventory via photo, utang ledger, GCash...",content:`Sari-Sari Store App — Concept Note

What if we digitized the sari-sari? Not to replace, but to support.

Core idea:
- Inventory via photo (snap shelves, AI counts)
- Utang ledger — simple, respectful, not predatory
- GCash + cash hybrid
- Daily benta summary in Tagalog
- Low data mode — works offline

Inspiration: My Tita's store in Cavite. She writes everything in a pink notebook. It works. Can we make something that feels like that notebook, not like a POS system?

Names: Tindahan, Listahan, Sari?

Need to talk to 3 store owners before building anything. No assumptions.

Linked to: [[Amihan Studio - Client Proposal]] • [[Goals: Build Something Small]]`,date:"Sep 15",editedAt:"Edited Sep 16",tags:["Ideas","Work"],pinned:!1,wordCount:102},{id:"9",title:"Tagalog Words I Love",preview:"Gigil - the urge to squeeze something cute. Kilig - butterfly but better. Tampo - not mad, just... disappointed with love...",content:`Tagalog words that don't translate well — collection

gigil — the urge to squeeze something cute so hard. That feeling when you see a baby or a puppy. Hands get tight.

kilig — butterfly but better. The romance kind. When your crush replies.

tampo — not mad, just... disappointed with love. Need lambing.

sayang — waste, but with heartbreak. Sayang yung opportunity.

bayanihan — community doing the hard thing together. Carrying the house.

harana — to serenade. We don't do this enough anymore.

Need to use these more. English is efficient, Tagalog is felt.
